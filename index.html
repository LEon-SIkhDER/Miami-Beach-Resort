    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:description" content="Experience coastal elegance at Miami Beach Resort, Cox's Bazar. Book luxury sea-view rooms, premium suites, and beachfront hospitality." />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:description" content="Experience coastal elegance at Miami Beach Resort, Cox's Bazar. Book luxury sea-view rooms, premium suites, and beachfront hospitality." />

    <!-- PWA Manifest & Mobile App Capability -->
    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Fonts: Luxury Royal Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased bg-[#fcfbf9] text-slate-800 min-h-screen selection:bg-[#c5a880]/30 selection:text-[#03221b]">
    <!-- Luxury PWA Opening Animation Splash Screen (Mobile Only below 640px) -->
    <style>
      #pwa-splash {
        display: none;
      }
      @media (max-width: 639px) {
        #pwa-splash {
          display: flex !important;
        }
      }
      @media (min-width: 640px) {
        #pwa-splash {
          display: none !important;
        }
      }
      @keyframes pwaPulse {
        0% { transform: scale(0.92); opacity: 0.85; }
        50% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.92); opacity: 0.85; }
      }
      @keyframes pwaGoldShimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes pwaBarProgress {
        0% { width: 0%; opacity: 0.3; }
        50% { width: 65%; opacity: 1; }
        100% { width: 100%; opacity: 1; }
      }
      .pwa-logo-anim {
        animation: pwaPulse 2.4s ease-in-out infinite;
        filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 15px rgba(197, 168, 128, 0.3));
      }
      .pwa-title-anim {
        background: linear-gradient(90deg, #c5a880 0%, #ffffff 50%, #c5a880 100%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: pwaGoldShimmer 3s linear infinite;
      }
      .pwa-progress-line {
        animation: pwaBarProgress 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .splash-fade-out {
        opacity: 0 !important;
        transform: scale(1.04) !important;
        pointer-events: none !important;
      }
    </style>
    <div id="pwa-splash" style="position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at center, #063d31 0%, #03221b 100%);flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);user-select:none;pointer-events:all;">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;max-width:360px;">
        <img src="/logo.png" alt="Miami Beach Resort" class="pwa-logo-anim" style="width:100px;height:100px;object-fit:contain;margin-bottom:20px;" />
        <h1 class="pwa-title-anim" style="font-family:'Cinzel', serif;font-size:22px;font-weight:700;letter-spacing:0.08em;margin:0 0 6px 0;text-transform:uppercase;">Miami Beach Resort</h1>
        <p style="font-family:'Plus Jakarta Sans', sans-serif;font-size:11px;font-weight:600;letter-spacing:0.25em;color:#e2d4be;margin:0 0 28px 0;text-transform:uppercase;opacity:0.9;">Cox's Bazar</p>
        <div style="width:130px;height:2.5px;background:rgba(255,255,255,0.12);border-radius:99px;overflow:hidden;">
          <div class="pwa-progress-line" style="height:100%;background:linear-gradient(90deg, #c5a880, #fae8c8, #01966e);border-radius:99px;"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
